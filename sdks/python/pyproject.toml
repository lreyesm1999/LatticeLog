[project]
name = "latticelog"
version = "0.1.0a1"
description = "LatticeLog SDK for Python: structured logs to a local durable spool, shipped to latticelog-server"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["latticelog"]
