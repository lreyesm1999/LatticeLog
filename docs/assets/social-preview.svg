<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">LatticeLog</title>
  <desc id="d">LatticeLog: typed, local-first logs for .NET in an open binary format, with indexed queries and evidence for coding agents over MCP.</desc>
  <!-- GitHub social preview (Settings → General → Social preview). The logo is not in this file:
       scripts/render-assets.ps1 draws src/LatticeLog.Cli/latticelog.ico (256 px) at x=952, y=192 on top and saves
       social-preview.png, the file to upload. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1226"/>
      <stop offset="1" stop-color="#171C3D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#232B52" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)" opacity="0.55"/>
  <!-- soft light behind the logo -->
  <circle cx="1080" cy="320" r="250" fill="url(#glow)"/>
  <rect x="0" y="632" width="1280" height="8" fill="url(#accent)"/>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="78" y="230" fill="#E9ECF2" font-size="92" font-weight="700" letter-spacing="-2">LatticeLog</text>
    <text x="82" y="292" fill="#C3CAE6" font-size="30">Typed, local-first logs for .NET in an open binary format.</text>
    <text x="82" y="336" fill="#C3CAE6" font-size="30">Indexed queries. Evidence your coding agent can verify.</text>
  </g>

  <g font-family="Consolas, Menlo, monospace" font-size="24" fill="#AEB6D6">
    <g transform="translate(82 428)">
      <rect x="0" y="-18" width="10" height="10" rx="2" fill="#22D3EE"/>
      <text x="24" y="-8">source-generated events · open .llog format · MCP server</text>
    </g>
    <g transform="translate(82 474)">
      <rect x="0" y="-18" width="10" height="10" rx="2" fill="#A855F7"/>
      <text x="24" y="-8">.NET 10 · Python and PHP SDKs · no AI inside · MIT</text>
    </g>
  </g>

  <text x="82" y="566" fill="#6F7AA8" font-family="Consolas, Menlo, monospace" font-size="22">github.com/lreyesm1999/LatticeLog</text>
</svg>
