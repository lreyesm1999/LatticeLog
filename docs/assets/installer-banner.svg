       left part, so the mark sits at the right edge.
       Export: scripts/render-assets.ps1 → installer/windows/assets/banner.bmp -->
  <rect width="493" height="58" fill="#FFFFFF"/>
  <g transform="translate(439 7) scale(0.6875)">
