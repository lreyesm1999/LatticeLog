<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="t">
  <title id="t">LatticeLog</title>
  <!-- The mark: a lattice of blocks (segments) with the few an indexed read actually touches, in amber. -->
  <rect width="64" height="64" rx="14" fill="#121722"/>
  <g fill="#1E2738" stroke="#3A4762" stroke-width="1.5">
    <rect x="9" y="9" width="13" height="13" rx="3"/>
    <rect x="25.5" y="9" width="13" height="13" rx="3"/>
    <rect x="42" y="9" width="13" height="13" rx="3"/>
    <rect x="9" y="25.5" width="13" height="13" rx="3"/>
    <rect x="42" y="25.5" width="13" height="13" rx="3"/>
    <rect x="9" y="42" width="13" height="13" rx="3"/>
    <rect x="25.5" y="42" width="13" height="13" rx="3"/>
  </g>
  <g fill="#F4B740">
    <rect x="25.5" y="25.5" width="13" height="13" rx="3"/>
    <rect x="42" y="42" width="13" height="13" rx="3"/>
  </g>
  <path d="M32 38.5 V40.25 H48.5 V42" fill="none" stroke="#F4B740" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
