<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 493 312" width="493" height="312">
  <!-- Windows installer: background of the welcome and finish pages (WixUIDialogBmp, 493×312). The installer writes its
       text over the white area on the right, so the artwork stays in the left 164 px.
       Export: scripts/render-assets.ps1 → installer/windows/assets/dialog.bmp. The script draws the icon
       (src/LatticeLog.Cli/latticelog.ico, 112 px) at x=26, y=40 on top of this. -->
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0V16" fill="none" stroke="#1A2142" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
  </defs>
  <rect width="493" height="312" fill="#FFFFFF"/>
  <rect width="164" height="312" fill="#0D1226"/>
  <rect width="164" height="312" fill="url(#grid)"/>
  <text x="82" y="186" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#E6EAF2">LatticeLog</text>
  <text x="82" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#8A96C8">typed, local-first logs</text>
  <rect x="0" y="309" width="164" height="3" fill="url(#accent)"/>
</svg>
