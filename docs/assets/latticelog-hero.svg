<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">LatticeLog</title>
  <desc id="d">Typed, local-first logs in an open binary format: capture, store, query and hand over evidence.</desc>
  <!-- README banner. The logo is not in this file: scripts/render-assets.ps1 draws src/LatticeLog.Cli/latticelog.ico
       (256 px) at x=904, y=72 on top and saves latticelog-hero.png, which is what the README shows. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1226"/>
      <stop offset="1" stop-color="#171C3D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#232B52" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="400" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1280" height="400" fill="url(#bg)"/>
    <rect width="1280" height="400" fill="url(#grid)" opacity="0.55"/>
    <!-- soft light behind the logo -->
    <circle cx="1032" cy="200" r="230" fill="url(#glow)"/>
    <rect x="0" y="394" width="1280" height="6" fill="url(#accent)"/>
  </g>

  <text x="72" y="150" fill="#E9ECF2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-1.5">LatticeLog</text>
  <text x="74" y="204" fill="#AEB6D6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">Typed, local-first logs in an open binary format.</text>
  <text x="74" y="240" fill="#AEB6D6" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">Read only what you need. Hand over verifiable evidence.</text>
  <g font-family="Consolas, Menlo, monospace" font-size="18" fill="#22D3EE">
    <text x="74" y="316">.llog · .NET 10 · Python · PHP · MCP</text>
  </g>
</svg>
