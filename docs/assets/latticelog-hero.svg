<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-labelledby="t d">
  <title id="t">LatticeLog</title>
  <desc id="d">Typed, local-first logs in an open binary format: capture, store, query and hand over evidence.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121722"/>
      <stop offset="1" stop-color="#1B2433"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F4B740"/>
      <stop offset="1" stop-color="#F08A3C"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2A3346" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)" opacity="0.55"/>

  <!-- lattice of blocks: segments being written, indexed and read -->
  <g transform="translate(808 64)">
    <g fill="#1E2738" stroke="#33405A" stroke-width="2">
      <rect x="0" y="0" width="96" height="56" rx="10"/>
      <rect x="112" y="0" width="96" height="56" rx="10"/>
      <rect x="224" y="0" width="96" height="56" rx="10"/>
      <rect x="336" y="0" width="96" height="56" rx="10"/>
      <rect x="0" y="72" width="96" height="56" rx="10"/>
      <rect x="224" y="72" width="96" height="56" rx="10"/>
      <rect x="336" y="72" width="96" height="56" rx="10"/>
      <rect x="0" y="144" width="96" height="56" rx="10"/>
      <rect x="112" y="144" width="96" height="56" rx="10"/>
      <rect x="336" y="144" width="96" height="56" rx="10"/>
      <rect x="112" y="216" width="96" height="56" rx="10"/>
      <rect x="224" y="216" width="96" height="56" rx="10"/>
    </g>
    <g fill="url(#amber)">
      <rect x="112" y="72" width="96" height="56" rx="10"/>
      <rect x="224" y="144" width="96" height="56" rx="10"/>
      <rect x="336" y="216" width="96" height="56" rx="10"/>
    </g>
    <g fill="#E9ECF2" opacity="0.9">
      <rect x="16" y="20" width="44" height="6" rx="3"/><rect x="16" y="32" width="28" height="6" rx="3"/>
      <rect x="128" y="20" width="52" height="6" rx="3"/><rect x="128" y="32" width="24" height="6" rx="3"/>
      <rect x="240" y="20" width="36" height="6" rx="3"/><rect x="240" y="32" width="48" height="6" rx="3"/>
      <rect x="352" y="20" width="56" height="6" rx="3"/><rect x="352" y="32" width="30" height="6" rx="3"/>
    </g>
    <g fill="#121722">
      <rect x="128" y="92" width="52" height="6" rx="3"/><rect x="128" y="104" width="30" height="6" rx="3"/>
      <rect x="240" y="164" width="40" height="6" rx="3"/><rect x="240" y="176" width="56" height="6" rx="3"/>
      <rect x="352" y="236" width="48" height="6" rx="3"/><rect x="352" y="248" width="26" height="6" rx="3"/>
    </g>
    <path d="M208 100 H224 M320 172 H336" stroke="#F4B740" stroke-width="3" stroke-linecap="round"/>
    <path d="M160 128 V144 M272 200 V216" stroke="#F4B740" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <text x="72" y="150" fill="#E9ECF2" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-1.5">LatticeLog</text>
  <text x="74" y="204" fill="#A9B3C4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">Typed, local-first logs in an open binary format.</text>
  <text x="74" y="240" fill="#A9B3C4" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24">Read only what you need. Hand over verifiable evidence.</text>
  <g font-family="Consolas, Menlo, monospace" font-size="18" fill="#F4B740">
    <text x="74" y="316">.llog · .NET 10 · Python · PHP · MCP</text>
  </g>
</svg>
