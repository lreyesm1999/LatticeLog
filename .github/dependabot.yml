version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      test-tooling:
        patterns: ["xunit*", "Microsoft.NET.Test.Sdk", "coverlet*"]
      roslyn:
        patterns: ["Microsoft.CodeAnalysis*"]
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
