name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security issues go through private reporting**, not here (see SECURITY.md).
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - .NET SDK / logger
        - Source generator
        - Storage (.llog format, recovery, compaction, retention)
        - Query / CLI
        - Evidence / MCP
        - Server (ingest, read API, admin, console)
        - Python SDK
        - PHP SDK
        - Docs
    validations:
      required: true
  - type: checkboxes
    id: integrity
    attributes:
      label: Data integrity
      options:
        - label: This involves lost, duplicated or corrupted records, or a durability ACK that was not honoured
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Code, commands and, if possible, `latticelog verify --format json` output.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: 0.1.0-alpha.1 or a commit SHA
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, .NET / Python / PHP version
