# Static analysis (SAST) with CodeQL: C# is built for real (the source generator runs), Python, JavaScript (the web
# console) and the workflows themselves are analyzed from source. Results appear under Security → Code scanning.
name: codeql
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        if: matrix.build-mode == 'manual'
        with:
          global-json-file: global.json
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality
      - name: Build
        if: matrix.build-mode == 'manual'
        run: dotnet build LatticeLog.sln -c Release
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
