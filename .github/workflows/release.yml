# Publishes a GitHub Release when a version tag is pushed (git tag v0.1.0-alpha.2 && git push origin v0.1.0-alpha.2).
# Builds the single-file Native AOT executable per platform with the tag as its version, checks that it reports that
# version, and attaches the executables plus SHA256SUMS. `latticelog update` downloads from these releases and verifies
# the checksum before running `setup`. A tag with a hyphen (v1.2.0-beta.1) is published as a pre-release.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
            file: latticelog.exe
            asset: latticelog-win-x64.exe
          - os: ubuntu-latest
            rid: linux-x64
            file: latticelog
            asset: latticelog-linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Native AOT publish with the tag's version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish src/LatticeLog.Cli -c Release -r ${{ matrix.rid }} -p:PublishAot=true -p:Version="$version" -o aot
          mkdir -p dist
          cp "aot/${{ matrix.file }}" "dist/${{ matrix.asset }}"
      - name: The executable reports the tag's version
        shell: bash
        run: |
          reported="$("dist/${{ matrix.asset }}" --version)"
          echo "$reported"
          test "$reported" = "latticelog ${GITHUB_REF_NAME#v}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: dist/${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum latticelog-* > SHA256SUMS
          cat SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "LatticeLog ${GITHUB_REF_NAME#v}" \
            --notes "Install or update: download the executable for your platform and run \`latticelog setup\`, or run \`llog update\` on an installed LatticeLog. Verify downloads against SHA256SUMS." \
            $prerelease
