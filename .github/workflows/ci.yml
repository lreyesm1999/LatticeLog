# Fast CI + Correctness CI + basic supply-chain checks (plan §5).
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Code style (whitespace)
        run: dotnet format whitespace LatticeLog.sln --verify-no-changes

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: structlog (Python SDK local-mode tests, and SourcesTests' Python end-to-end test)
        run: python -m pip install structlog
      - run: dotnet build LatticeLog.sln -c Release
      - run: dotnet test LatticeLog.sln -c Release --no-build
      - name: Python SDK tests (local mode, structlog)
        run: python -m unittest discover -s sdks/python/tests
      - name: Independent reader on golden files (gate G4)
        run: python -I tools/pyllog/llog.py verify-golden tests/GoldenFiles/v0.1 tests/GoldenFiles/v0.2
      - name: Lab smoke (round trips must verify)
        run: dotnet run -c Release --no-build --project research/LatticeLog.Lab -- baseline --events 5000 --reps 1 --out lab-smoke

  aot-and-pack:
    # Native AOT needs a native toolchain (clang on the Linux runner); it could not be verified on the Windows dev box.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Native AOT publish of the CLI (warnings are errors for src/ via Directory.Build.targets)
        run: dotnet publish src/LatticeLog.Cli -c Release -r linux-x64 -p:PublishAot=true -o aot
      - name: AOT binary smoke test
        run: |
          dotnet run -c Release --project examples/dotnet-console -- demo-store 2000
          ./aot/latticelog verify demo-store --format json
          ./aot/latticelog query demo-store --where "level >= ERROR" --limit 3 --format jsonl
          ./aot/latticelog stats demo-store --by event --format json
      - name: Pack (verification only; packages are not published from CI)
        run: dotnet pack LatticeLog.sln -c Release -o packages
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages

  container:
    # Builds the server image, scans it, and runs it over real TLS: health, ingestion with the Python SDK, queries,
    # an untrusted client refused, non-root user, data kept across a restart (deploy/smoke-test.sh).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t latticelog-server:ci .
      - name: Scan the image (fixable HIGH/CRITICAL vulnerabilities fail the build)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: latticelog-server:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Smoke test over HTTPS
        run: bash deploy/smoke-test.sh latticelog-server:ci

  backup-drill-source:
    # P24-T06: a backup made on one machine must restore on another one, with a different OS and CPU architecture.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Write a store and take a verified hot backup of it
        run: |
          dotnet build src/LatticeLog.Cli -c Release
          dotnet build examples/dotnet-console -c Release
          dotnet run -c Release --no-build --project examples/dotnet-console -- demo-store 2000
          dotnet run -c Release --no-build --project src/LatticeLog.Cli -- backup demo-store drill/backup
          dotnet run -c Release --no-build --project src/LatticeLog.Cli -- export drill/backup --format llog-jsonl --output drill/expected.jsonl
      - uses: actions/upload-artifact@v7
        with:
          name: backup-drill
          path: drill

  backup-drill-restore:
    needs: backup-drill-source
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          name: backup-drill
          path: drill
      - name: Restore, verify, compare record by record, then keep writing
        run: |
          dotnet build src/LatticeLog.Cli -c Release
          dotnet build examples/dotnet-console -c Release
          cli() { dotnet run -c Release --no-build --project src/LatticeLog.Cli -- "$@"; }
          cp -R drill/backup restored
          cli verify restored
          cli export restored --format llog-jsonl --output restored.jsonl
          cmp drill/expected.jsonl restored.jsonl
          before=$(grep -c '^{"type":"record"' restored.jsonl)
          dotnet run -c Release --no-build --project examples/dotnet-console -- restored 200
          cli verify restored
          cli export restored --format llog-jsonl --output after.jsonl
          after=$(grep -c '^{"type":"record"' after.jsonl)
          echo "restored $before records, $after after writing on ${{ matrix.os }}"
          if [ "$after" -le "$before" ]; then echo "the restored store did not accept new writes"; exit 1; fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Vulnerable packages
        run: dotnet list LatticeLog.sln package --vulnerable --include-transitive
      - name: SBOM (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX
          dotnet-CycloneDX LatticeLog.sln -o sbom
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom
