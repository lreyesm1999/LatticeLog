# Fast CI + Correctness CI + basic supply-chain checks (plan §5).
name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Code style (whitespace)
        run: dotnet format whitespace LatticeLog.sln --verify-no-changes

  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: structlog (Python SDK local-mode tests, and SourcesTests' Python end-to-end test)
        run: python -m pip install structlog
      - name: Rust toolchain (SdkTests/SourcesTests build sdks/rust/examples/smoke.rs; they fail in CI without cargo)
        shell: bash
        run: |
          if ! command -v cargo >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          if [ -d "$HOME/.cargo/bin" ]; then
            # GITHUB_PATH takes native paths (C:\... on Windows).
            (cygpath -w "$HOME/.cargo/bin" 2>/dev/null || echo "$HOME/.cargo/bin") >> "$GITHUB_PATH"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo --version
      - run: dotnet build LatticeLog.sln -c Release
      - run: dotnet test LatticeLog.sln -c Release --no-build
      - name: Python SDK tests (local mode, structlog)
        run: python -m unittest discover -s sdks/python/tests
      - name: Independent reader on golden files (gate G4)
        run: python -I tools/pyllog/llog.py verify-golden tests/GoldenFiles/v0.1 tests/GoldenFiles/v0.2 tests/GoldenFiles/v0.3
      - name: Documented examples (README and getting-started commands, ASP.NET Core self-check)
        shell: bash
        run: sh scripts/check-examples.sh "$RUNNER_TEMP/examples"
      - name: Lab smoke (round trips must verify)
        run: dotnet run -c Release --no-build --project research/LatticeLog.Lab -- baseline --events 5000 --reps 1 --out lab-smoke

  rust-sdk:
    # The Rust SDK on its own: formatting, clippy for each feature set (TLS included, which needs a C compiler for
    # ring), unit tests and the local/server integration tests. The cross-language tests against the real server run
    # in build-test (SdkTests/SourcesTests build sdks/rust/examples/smoke.rs with the runner's cargo).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdks/rust
    steps:
      - uses: actions/checkout@v7
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal -c clippy -c rustfmt && rustup default stable
      - run: cargo fmt --check
      - run: cargo clippy --no-default-features -- -D warnings
      - run: cargo clippy --all-targets --features server -- -D warnings
      - run: cargo clippy --all-features -- -D warnings
      - run: cargo test --features server

  typescript-sdk:
    # The TypeScript/Node.js SDK on its own: type check and build (tsc), then node:test (local mode, server mode against
    # a fake ingest server, pino and winston integrations), on the oldest supported Node.js and a current one. The
    # cross-language tests against the real server run in build-test (SdkTests/SourcesTests build the package and run
    # sdks/typescript/examples/smoke.mjs with the runner's node; skipped when node is missing).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['20', '24']
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: sdks/typescript
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --no-audit --no-fund
      - run: npm test

  aot:
    # The single-file Native AOT executable that `latticelog setup` installs: built per OS (a native linker is needed:
    # MSVC on the Windows runner, clang on Linux), then smoke-tested with dotnet removed from PATH and every DOTNET_*
    # variable unset, and again inside a container image that has no .NET at all. The smoke test runs list_sources and
    # get_error_groups through `latticelog mcp` (auto-started background service) and in-process (--no-service).
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-2022
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Native AOT publish of the CLI (warnings are errors for src/ via Directory.Build.targets)
        run: dotnet publish src/LatticeLog.Cli -c Release -r ${{ matrix.rid }} -p:PublishAot=true -o aot
      - name: Store commands on the AOT binary
        if: runner.os == 'Linux'
        run: |
          dotnet run -c Release --project examples/dotnet-console -- demo-store 2000
          ./aot/latticelog verify demo-store --format json
          ./aot/latticelog query demo-store --where "level >= ERROR" --limit 3 --format jsonl
          ./aot/latticelog stats demo-store --by event --format json
      - name: Smoke test, no .NET reachable (Linux)
        if: runner.os == 'Linux'
        run: sh scripts/smoke-aot.sh aot/latticelog
      - name: Smoke test, no .NET reachable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-aot.ps1 -Exe aot/latticelog.exe
      - name: Smoke test in a container without .NET (debian; OpenSSL is the only library added)
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD:/w" -w /w debian:bookworm-slim sh -c "apt-get update -qq && apt-get install -y -qq libssl3 >/dev/null && sh scripts/smoke-aot.sh aot/latticelog"
      - name: Smoke test in a container without .NET (Windows Server Core)
        if: runner.os == 'Windows'
        shell: pwsh
        run: docker run --rm -v "${PWD}:C:\w" -w "C:\w" mcr.microsoft.com/windows/servercore:ltsc2022 powershell -NoProfile -ExecutionPolicy Bypass -File scripts\smoke-aot.ps1 -Exe aot\latticelog.exe
      - uses: actions/upload-artifact@v7
        with:
          name: latticelog-${{ matrix.rid }}
          path: |
            aot/latticelog
            aot/latticelog.exe

  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Pack (verification only; packages are not published from CI)
        run: dotnet pack LatticeLog.sln -c Release -o packages
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: packages

  aot-and-pack:
    # The former single job of this name was split into aot (per platform) and pack. Branch protection requires a
    # check called aot-and-pack, so this one stands for both: it passes only when every aot build and pack passed.
    needs: [aot, pack]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: aot and pack passed
        run: |
          echo "aot: ${{ needs.aot.result }}, pack: ${{ needs.pack.result }}"
          test "${{ needs.aot.result }}" = success && test "${{ needs.pack.result }}" = success

  container:
    # Builds the server image, scans it, and runs it over real TLS: health, ingestion with the Python SDK, queries,
    # an untrusted client refused, non-root user, data kept across a restart (deploy/smoke-test.sh).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -f deploy/Dockerfile -t latticelog-server:ci .
      - name: Scan the image (fixable HIGH/CRITICAL vulnerabilities fail the build)
        # Third-party action pinned to a commit (a tag can be moved); Dependabot keeps the SHA and the comment current.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: latticelog-server:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Smoke test over HTTPS
        run: bash deploy/smoke-test.sh latticelog-server:ci

  backup-drill-source:
    # P24-T06: a backup made on one machine must restore on another one, with a different OS and CPU architecture.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Write a store and take a verified hot backup of it
        run: |
          dotnet build src/LatticeLog.Cli -c Release
          dotnet build examples/dotnet-console -c Release
          dotnet run -c Release --no-build --project examples/dotnet-console -- demo-store 2000
          dotnet run -c Release --no-build --project src/LatticeLog.Cli -- backup demo-store drill/backup
          dotnet run -c Release --no-build --project src/LatticeLog.Cli -- export drill/backup --format llog-jsonl --output drill/expected.jsonl
      - uses: actions/upload-artifact@v7
        with:
          name: backup-drill
          path: drill

  backup-drill-restore:
    needs: backup-drill-source
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - uses: actions/download-artifact@v8
        with:
          name: backup-drill
          path: drill
      - name: Restore, verify, compare record by record, then keep writing
        run: |
          dotnet build src/LatticeLog.Cli -c Release
          dotnet build examples/dotnet-console -c Release
          cli() { dotnet run -c Release --no-build --project src/LatticeLog.Cli -- "$@"; }
          cp -R drill/backup restored
          cli verify restored
          cli export restored --format llog-jsonl --output restored.jsonl
          cmp drill/expected.jsonl restored.jsonl
          before=$(grep -c '^{"type":"record"' restored.jsonl)
          dotnet run -c Release --no-build --project examples/dotnet-console -- restored 200
          cli verify restored
          cli export restored --format llog-jsonl --output after.jsonl
          after=$(grep -c '^{"type":"record"' after.jsonl)
          echo "restored $before records, $after after writing on ${{ matrix.os }}"
          if [ "$after" -le "$before" ]; then echo "the restored store did not accept new writes"; exit 1; fi

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Vulnerable packages
        run: dotnet list LatticeLog.sln package --vulnerable --include-transitive
      - name: SBOM (CycloneDX)
        run: |
          dotnet tool install --global CycloneDX
          dotnet-CycloneDX LatticeLog.sln -o sbom
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom
